spring.application.name=demo
server.port=8080

# Configuración de CORS
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuración de JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.com.curso.demo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator - Endpoints de monitoreo
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Configuración existente
config.codigo = 12345
config.usuario = informaticonfig
config.mensaje = hola a todos
config.valores = saludos, alumnos, de, springboot

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/geekcards
spring.datasource.username=geek
spring.datasource.password=geekpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para que cree automáticamente las tablas a partir de tus Entity
spring.jpa.hibernate.ddl-auto=update

# Opcional: para ver las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
security.jwt.secret=${JWT_SECRET:Z2Vla2NhcmRzLXN1cGVyLXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZQ==}
security.jwt.expiration=3600000

# Importación de cartas
cards.import-on-start=${CARDS_IMPORT_ON_START:true}
