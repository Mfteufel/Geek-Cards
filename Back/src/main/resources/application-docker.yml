spring:
  datasource:
    url: jdbc:mysql://db:3306/geekcards?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:geek}
    password: ${DB_PASSWORD:geekpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.geekcards: DEBUG
    org.hibernate.SQL: DEBUG