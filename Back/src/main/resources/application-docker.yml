spring:
  datasource:
    url: jdbc:mysql://db:3306/geekcards?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:geek}
    password: ${DB_PASSWORD:geekpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4173}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8080

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.geekcards: DEBUG
    org.hibernate.SQL: DEBUG